# ============================================================
# Student Grader Workflow
# Version: 1.3.0
# ============================================================

name: Student Grader

on:
  # Allows the workflow to be triggered manually.
  workflow_dispatch:

  # Runs every Monday at 9:00 a.m. Colombia time.
  schedule:
    - cron: "0 9 * * 1"
      timezone: "America/Bogota"


# ============================================================
# Permissions
# ============================================================

permissions:
  contents: read


# ============================================================
# Global Configuration
# ============================================================

env:
  PYTHON_VERSION: "3.12"
  REPORT_DAYS: "90"
  MONGODB_DATABASE: "fis_grader"


# ============================================================
# Jobs
# ============================================================

jobs:
  analyze:
    name: Analyze ${{ matrix.id }}

    runs-on: ubuntu-latest

    # Prevent a faulty process from running indefinitely.
    timeout-minutes: 15

    strategy:
      # A failure in one group must not stop the remaining groups.
      fail-fast: false

      matrix:
        include:

          - id: G1
            repository: puj-course/FIS_2630_1204_G1

          - id: G2
            repository: puj-course/FIS_2630_1204_G2

          - id: G3
            repository: puj-course/FIS_2630_1204_G3

          - id: G4
            repository: puj-course/FIS_2630_1204_G4

          - id: G5
            repository: puj-course/FIS_2610_3513_G4

          


    steps:

      # ========================================================
      # 1. CHECK OUT REPOSITORIES
      # ========================================================

      - name: Check out grader repository
        uses: actions/checkout@v7

        with:
          path: grader

          # Credentials are not needed after checkout.
          persist-credentials: false


      - name: Check out student repository
        uses: actions/checkout@v7

        with:
          repository: ${{ matrix.repository }}

          # PAT with read access to the student repositories.
          token: ${{ secrets.STUDENT_REPOS_TOKEN }}

          path: student

          # Full history is required for commit analysis.
          fetch-depth: 0

          # Do not persist the PAT after checkout.
          persist-credentials: false


      # ========================================================
      # 2. SET UP PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v7

        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Display Python version
        run: python --version


      # ========================================================
      # 3. INSTALL REPORTING DEPENDENCIES
      # ========================================================

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymongo dnspython


      # ========================================================
      # 4. LOCATE COMMIT REPORTER
      # ========================================================

      - name: Locate commit analysis script
        id: locate-script

        shell: bash

        run: |
          set -euo pipefail

          echo "Available files in the grader repository:"
          find grader -type f -print | sort

          SCRIPT="$(
            find grader \
              -type f \
              \( \
                -name "commit_report.py" \
                -o -name "commit_counter.py" \
              \) \
              -print \
              -quit
          )"

          if [[ -z "$SCRIPT" ]]; then
            echo "::error::Neither commit_report.py nor commit_counter.py was found."
            exit 1
          fi

          echo "Commit analysis script found: $SCRIPT"

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 5. GENERATE COMMIT REPORTS
      # ========================================================

      - name: Generate commit reports
        shell: bash

        run: |
          set -euo pipefail

          python "${{ steps.locate-script.outputs.script }}" \
            --repository student \
            --days "$REPORT_DAYS" \
            --authors-output "authors-${{ matrix.id }}.json" \
            --repository-output "repository-${{ matrix.id }}.json"


      # ========================================================
      # 6. VALIDATE GENERATED REPORTS
      # ========================================================

      - name: Validate generated reports
        shell: bash

        run: |
          set -euo pipefail

          AUTHORS_REPORT="authors-${{ matrix.id }}.json"
          REPOSITORY_REPORT="repository-${{ matrix.id }}.json"

          echo "Generated JSON files:"
          find . \
            -maxdepth 2 \
            -type f \
            -name "*.json" \
            -print \
            | sort

          if [[ ! -f "$AUTHORS_REPORT" ]]; then
            echo "::error::Expected report was not generated: $AUTHORS_REPORT"
            exit 1
          fi

          if [[ ! -f "$REPOSITORY_REPORT" ]]; then
            echo "::error::Expected report was not generated: $REPOSITORY_REPORT"
            exit 1
          fi

          # Validate JSON syntax before persisting anything.
          python -m json.tool "$AUTHORS_REPORT" > /dev/null
          python -m json.tool "$REPOSITORY_REPORT" > /dev/null

          echo "Both reports are valid JSON files."


      # ========================================================
      # 7. DISPLAY REPORTS
      # ========================================================

      - name: Display author report
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AUTHOR REPORT - ${{ matrix.id }}"
          echo "=========================================="

          python -m json.tool \
            "authors-${{ matrix.id }}.json"


      - name: Display repository report
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REPOSITORY REPORT - ${{ matrix.id }}"
          echo "=========================================="

          python -m json.tool \
            "repository-${{ matrix.id }}.json"


      # ========================================================
      # 8. PERSIST REPORTS IN MONGODB ATLAS
      # ========================================================

      - name: Persist reports in MongoDB Atlas
        shell: bash

        env:
          # Stored securely in GitHub Actions Secrets.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

        run: |
          set -euo pipefail

          python grader/src/classroom/persist_reports.py \
            --authors-report "authors-${{ matrix.id }}.json" \
            --repository-report "repository-${{ matrix.id }}.json" \
            --group-id "${{ matrix.id }}" \
            --repository "${{ matrix.repository }}" \
            --database "$MONGODB_DATABASE" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-attempt "${{ github.run_attempt }}" \
            --github-workflow "${{ github.workflow }}"


      # ========================================================
      # 9. AUTOMATED AI GRADER
      # ========================================================
      #
      # Temporarily disabled to avoid consuming API tokens.
      #
      # Uncomment the following steps when the automated
      # source-code evaluation is ready to be enabled.
      # ========================================================

      # - name: Install AI grader dependencies
      #   run: |
      #     python -m pip install openai


      # - name: Run automated grader
      #   env:
      #     DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      #     STUDENT_ID: ${{ matrix.id }}
      #     STUDENT_REPOSITORY: ${{ matrix.repository }}
      #     AUTHORS_REPORT: authors-${{ matrix.id }}.json
      #     REPOSITORY_REPORT: repository-${{ matrix.id }}.json
      #
      #   run: |
      #     python grader/src/grader.py \
      #       --repository student \
      #       --required-files \
      #       src/main/java/com/skillstack/devhub/builder/ProgressBuilder.java


      # ========================================================
      # 10. UPLOAD REPORT ARTIFACTS
      # ========================================================
      #
      # Artifacts are uploaded even if MongoDB persistence fails.
      # This preserves the generated reports for troubleshooting.
      # ========================================================

      - name: Upload author report
        if: always()

        uses: actions/upload-artifact@v7

        with:
          name: authors-${{ matrix.id }}

          path: authors-${{ matrix.id }}.json

          if-no-files-found: error


      - name: Upload repository report
        if: always()

        uses: actions/upload-artifact@v7

        with:
          name: repository-${{ matrix.id }}

          path: repository-${{ matrix.id }}.json

          if-no-files-found: error


      # ========================================================
      # AI GRADER ARTIFACT
